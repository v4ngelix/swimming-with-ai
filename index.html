<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swimming with AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f3;
    --surface: #ffffff;
    --ink: #1d2b30;
    --muted: #7b8e95;
    --coral: #e8615a;
    --teal: #0f8a94;
    --sand: #f2c94c;
    --pad: 12px;
    --gap: 18px;
    --radius: 18px;
    --shadow: 0 2px 6px rgba(29, 43, 48, .06);
    --shadow-lift: 0 14px 32px rgba(29, 43, 48, .16);
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 clamp(16px, 4vw, 48px) 72px;
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(70vw 55vh at 8% -10%, rgba(15, 138, 148, .16), transparent 70%),
      radial-gradient(60vw 50vh at 100% 0%, rgba(232, 97, 90, .14), transparent 65%),
      radial-gradient(50vw 40vh at 50% 100%, rgba(242, 201, 76, .12), transparent 70%),
      var(--bg);
    background-attachment: fixed;
  }

  header {
    max-width: 1600px;
    margin: 0 auto;
    padding: clamp(36px, 7vw, 72px) 0 clamp(24px, 4vw, 40px);
    text-align: center;
  }

  .places {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 1rem 0;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    margin: 0;
    padding: 6px 14px;
    border: 0;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: var(--shadow);
    color: var(--muted);
    font: 600 .78rem/1.5 var(--sans);
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color .16s ease, box-shadow .16s ease;
  }
  .eyebrow::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    opacity: .4;
  }
  .eyebrow:hover { color: var(--teal); box-shadow: var(--shadow-lift); }
  .eyebrow:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  /* the location on show */
  .eyebrow[aria-pressed="true"] { color: var(--teal); cursor: default; }
  .eyebrow[aria-pressed="true"]::before { background: var(--coral); opacity: 1; }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(2.1rem, 6vw, 4rem);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -.02em;
    background: linear-gradient(100deg, var(--teal), #1d2b30 45%, var(--coral));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 14px auto 0;
    max-width: 50ch;
    color: var(--muted);
    font-size: clamp(.95rem, 1.6vw, 1.1rem);
  }

  .wall {
    max-width: 1600px;
    margin: 0 auto;
    column-width: 300px;
    column-gap: var(--gap);
  }

  figure {
    position: relative;
    margin: 0 0 var(--gap);
    break-inside: avoid;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: transform .28s cubic-bezier(.2, .7, .3, 1), box-shadow .28s ease;
    /* keeps the browser from re-laying-out offscreen tiles */
    content-visibility: auto;
    contain-intrinsic-size: 300px 400px;
  }
  figure { cursor: pointer; }
  figure:hover,
  figure:focus-within { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
  figure:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  /* the picture picked by a click; its name is kept in the page url */
  figure.selected { outline: 3px solid var(--coral); outline-offset: 3px; box-shadow: var(--shadow-lift); }

  figure img {
    display: block;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity .4s ease, transform .5s cubic-bezier(.2, .7, .3, 1);
  }
  figure img.loaded { opacity: 1; }
  figure:hover img { transform: scale(1.04); }

  /* one scrim over the whole tile, so the overlays stay readable on any photo */
  .scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .28s ease;
    background:
      linear-gradient(to top, rgba(12, 28, 32, .78) 0%, rgba(12, 28, 32, .12) 42%, transparent 62%),
      linear-gradient(to bottom, rgba(12, 28, 32, .45), transparent 38%);
  }
  figure:hover .scrim,
  figure:focus-within .scrim,
  figure.selected .scrim { opacity: 1; }

  figcaption {
    position: absolute;
    left: var(--pad);
    bottom: var(--pad);
    right: var(--pad);
    color: #fff;
    font-family: var(--serif);
    font-size: 1.05rem;
    font-weight: 500;
    font-style: italic;
    letter-spacing: .01em;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .45);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .28s ease, transform .28s ease;
    pointer-events: none;
  }

  .actions {
    position: absolute;
    top: var(--pad);
    right: var(--pad);
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .28s ease, transform .28s ease;
  }

  figure:hover figcaption,
  figure:focus-within figcaption,
  figure.selected figcaption { opacity: 1; transform: none; }
  figure:hover .actions,
  figure:focus-within .actions,
  figure.selected .actions { opacity: 1; transform: translateY(4px); }

  .actions a {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    color: var(--ink);
    background: rgba(255, 255, 255, .95);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    transition: background .16s ease, color .16s ease, transform .16s ease;
  }
  .actions a:hover { background: var(--coral); color: #fff; transform: scale(1.12); }
  .actions a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .actions svg { width: 19px; height: 19px; }

  /* marks photos added in the current app version; always visible, unlike the overlays */
  .badge-latest {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    z-index: 1;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--coral);
    color: #fff;
    font-size: .68rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    transition: transform .28s cubic-bezier(.2, .7, .3, 1);
  }
  /* cancels the tile's hover lift so the badge stays put on the page */
  figure:hover .badge-latest,
  figure:focus-within .badge-latest { transform: translateY(4px); }

  /* touch devices have no hover: show the overlays permanently */
  @media (hover: none) {
    .scrim, figcaption, .actions { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    figure, figure img, figcaption, .actions, .scrim, .badge-latest { transition: none; }
    figure:hover { transform: none; }
    figure:hover img { transform: none; }
    /* the tile no longer lifts, so nothing needs a counter-offset */
    figure:hover .badge-latest,
    figure:focus-within .badge-latest,
    figure:hover .actions,
    figure:focus-within .actions { transform: none; }
  }

  .message {
    max-width: 60ch;
    margin: 0 auto;
    padding: 28px;
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
    color: var(--muted);
    text-align: center;
  }
  .message code {
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(15, 138, 148, .1);
    color: var(--teal);
    font-size: .9em;
  }
</style>
</head>
<body>
  <header>
    <h1>Swimming with AI</h1>
    <p class="subtitle">Logging sightings and identifying the flora and fauna I've seen while swimming, using Claude in a dedicated project with custom instructions.</p>
    <p class="subtitle"><strong>NB!</strong> The names may well be wrong. After all, I'm only an enthusiastic amateur.</p>
    <nav class="places" id="places" aria-label="Locations"></nav>
  </header>

  <main class="wall" id="wall"></main>
  <p class="message" id="message" hidden></p>

<script type="module">
import locations from './locations.js';

(async function () {
  // replaced at build time by vite's `define`; empty when the page runs without vite
  const APP_VERSION = typeof __APP_VERSION__ === 'string' ? __APP_VERSION__ : '';

  const wall = document.getElementById('wall');
  const message = document.getElementById('message');

  const fail = (html) => {
    message.innerHTML = html;
    message.hidden = false;
  };

  const getJSON = async (url) => {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    return res.json();
  };

  let config, data;
  try {
    [config, data] = await Promise.all([getJSON('config.json'), getJSON('photos.json')]);
  } catch (err) {
    fail(`Could not load the photo data (${err.message}).<br>` +
         `Run <code>npm run photos</code>, then start the dev server with <code>npm run dev</code> — ` +
         `opening index.html straight from disk blocks the JSON files.`);
    return;
  }

  const assetsRoot = (config.assetsDir || 'assets').replace(/\/+$/, '');
  const buttons = config.buttons || [];
  const photosByPlace = data.photos || {};

  // newest place first (locations.js lists them oldest first)
  const places = Object.entries(locations).map(([id, place]) => ({ id, ...place })).reverse();

  // url-safe photo name: "Coris julis" -> "coris-julis"
  const slug = (title) => title.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  // ?location=<place url>&photo=<photo slug>, so a copied url reopens the same view
  const setUrl = (place, photo) => {
    const params = new URLSearchParams({ location: place.url });
    if (photo) params.set('photo', slug(photo.title));
    history.replaceState(null, '', `?${params}`);
  };

  // A button's link comes from the photo's own `links` map, falling back to the
  // button's urlTemplate. An explicit empty string hides the button for that photo.
  const resolveUrl = (photo, button) => {
    const own = photo.links && photo.links[button.id];
    if (own !== undefined) return own;
    if (!button.urlTemplate) return '';
    return button.urlTemplate
      .replace(/{title_underscore}/g, encodeURIComponent(photo.title.replace(/ /g, '_')))
      .replace(/{title}/g, encodeURIComponent(photo.title));
  };

  const buildFigure = (photo, assetsDir) => {
    const figure = document.createElement('figure');
    figure.tabIndex = 0;

    const img = document.createElement('img');
    img.src = `${assetsDir}/${encodeURIComponent(photo.file)}`;
    img.alt = photo.title;
    img.loading = 'lazy';
    img.decoding = 'async';
    if (photo.width && photo.height) { img.width = photo.width; img.height = photo.height; }
    img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
    figure.appendChild(img);

    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    figure.appendChild(scrim);

    if (photo.version && photo.version === APP_VERSION) {
      const badge = document.createElement('span');
      badge.className = 'badge-latest';
      badge.textContent = 'latest';
      figure.appendChild(badge);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    for (const button of buttons) {
      const url = resolveUrl(photo, button);
      if (!url) continue;
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = `${button.label || button.id} — ${photo.title}`;
      a.setAttribute('aria-label', a.title);
      a.innerHTML = button.icon || '';
      actions.appendChild(a);
    }
    if (actions.children.length) figure.appendChild(actions);

    const caption = document.createElement('figcaption');
    caption.textContent = photo.title;
    figure.appendChild(caption);

    return figure;
  };

  let current = { place: null, figure: null };

  // clicking the selected photo again clears the selection
  const select = (figure, photo) => {
    if (current.figure) current.figure.classList.remove('selected');
    const same = current.figure === figure;
    current.figure = same ? null : figure;
    if (!same) figure.classList.add('selected');
    setUrl(current.place, same ? null : photo);
  };

  const render = (place, photoSlug) => {
    current = { place, figure: null };
    wall.replaceChildren();
    message.hidden = true;

    const photos = photosByPlace[place.id] || [];
    if (!photos.length) {
      fail(`No photos yet. Drop images into <code>${assetsRoot}/${place.id}/</code> and run <code>npm run photos</code>.`);
      setUrl(place);
      return;
    }

    const frag = document.createDocumentFragment();
    let preselected = null;
    for (const photo of photos) {
      const figure = buildFigure(photo, `${assetsRoot}/${place.id}`);
      figure.addEventListener('click', (e) => { if (!e.target.closest('a')) select(figure, photo); });
      figure.addEventListener('keydown', (e) => {
        if (e.target === figure && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(figure, photo); }
      });
      if (photoSlug && slug(photo.title) === photoSlug) preselected = { figure, photo };
      frag.appendChild(figure);
    }
    wall.appendChild(frag);

    if (preselected) {
      select(preselected.figure, preselected.photo);
      preselected.figure.scrollIntoView({ block: 'center' });
    } else {
      setUrl(place);
    }
  };

  // one tag per place; the pressed tag marks the place on show
  const tags = document.getElementById('places');
  const show = (place, photoSlug) => {
    for (const tag of tags.children) tag.setAttribute('aria-pressed', tag.dataset.url === place.url);
    render(place, photoSlug);
  };
  for (const place of places) {
    const tag = document.createElement('button');
    tag.type = 'button';
    tag.className = 'eyebrow';
    tag.textContent = place.title;
    tag.dataset.url = place.url;
    tag.addEventListener('click', () => { if (place !== current.place) show(place); });
    tags.appendChild(tag);
  }

  // unknown or missing ?location= falls back to the newest place
  const params = new URLSearchParams(window.location.search);
  const initial = places.find((place) => place.url === params.get('location')) || places[0];
  show(initial, params.get('photo'));
})();
</script>
</body>
</html>
